<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b5d">
    <meta
      name="description"
      content="Sağlık Bilimleri Üniversitesi çalışma alanı"
    >
    <title>Sağlık Bilimleri Üniversitesi</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Menüyü aç"
        aria-controls="side-menu"
        aria-expanded="false"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <a class="brand" href="#/" aria-label="Anasayfa">
        Sağlık Bilimleri Üniversitesi
      </a>
    </header>

    <button
      class="backdrop"
      id="menu-backdrop"
      type="button"
      aria-label="Menüyü kapat"
      hidden
    ></button>

    <aside class="side-menu" id="side-menu" aria-label="Ana menü" hidden>
      <div class="menu-heading">
        <h2>Menü</h2>
        <p>Çalışma alanınıza hoş geldiniz</p>
      </div>
      <nav class="navigation" aria-label="Sayfalar">
        <a href="#/" data-route="home">Anasayfa</a>
        <a href="#/profile" data-route="profile">Profil</a>
        <a href="#/settings" data-route="settings">Ayarlar</a>
        <a href="#/page1" data-route="page1">Sayfa 1</a>
        <a href="#/page2" data-route="page2">Sayfa 2</a>
        <a href="#/page3" data-route="page3">Sayfa 3</a>
      </nav>
    </aside>

    <main class="main-content" id="main-content" tabindex="-1">
      <section class="welcome-card" id="page-content" aria-live="polite"></section>
    </main>
  </body>
</html>
