# If Android Studio reports an incompatible Gradle JDK, you can pin a compatible
# JDK here by setting `org.gradle.java.home` to your JDK install path.
# Example (Windows):
# org.gradle.java.home=C:/Program Files/Java/jdk-17.0.8
# Example (Windows with AdoptOpenJDK):
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.8.7-hotspot

# Leave commented out to let Android Studio / Gradle Wrapper choose the JDK.

android.useAndroidX=true
android.enableJetifier=true
